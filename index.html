<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>论说文 · 理由闯关</title>
<style>
:root{
  --bg:#f5f1e8; --bg-soft:#ece5d6; --surface:#fffdf8; --surface-2:#faf6ec;
  --ink:#27221a; --ink-2:#6c6354; --ink-3:#a89e8b; --line:#e5ddcc; --line-2:#f0eadb;
  --accent:#b5483c; --accent-soft:#f4e3de; --green:#3f826d; --green-soft:#e0ede7;
  --gold:#a9783f; --gold-soft:#f3e7d3; --red:#b5483c; --red-soft:#f5e2dd;
  --shadow:0 1px 2px rgba(46,38,24,.05),0 12px 32px rgba(46,38,24,.08);
  --shadow-lg:0 4px 12px rgba(46,38,24,.08),0 28px 60px rgba(46,38,24,.12);
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
}
[data-theme="dark"]{
  --bg:#16130d; --bg-soft:#1f1a12; --surface:#211c14; --surface-2:#282218;
  --ink:#ece4d4; --ink-2:#b3a78f; --ink-3:#7f7461; --line:#342c1e; --line-2:#2c2519;
  --accent:#d47768; --accent-soft:#3a2520; --green:#78b69c; --green-soft:#203029;
  --gold:#c79a55; --gold-soft:#372a17; --red:#d47768; --red-soft:#3a2520;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 28px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:600px;margin:0 auto;min-height:100vh;padding:18px 16px 40px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand h1{font-family:var(--serif);font-size:22px;letter-spacing:2px;font-weight:700}
.brand p{font-size:12px;color:var(--ink-3);margin-top:2px;letter-spacing:1px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-top:16px}
.start-emoji{font-size:50px;text-align:center;line-height:1}
.start h2{font-family:var(--serif);font-size:28px;text-align:center;letter-spacing:3px;font-weight:700}
.start .lead{text-align:center;color:var(--ink-2);font-size:13px;line-height:1.7}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:12px;color:var(--ink-2);letter-spacing:2px;margin-bottom:12px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:76px;padding:10px 8px;font-size:13px;font-weight:600;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);transition:all .15s}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bank-seg button.on{background:var(--gold);border-color:var(--gold)}
.weak-note{font-size:12px;color:var(--gold);margin-top:10px;text-align:center}
.big-btn{width:100%;padding:15px;font-size:17px;font-weight:700;letter-spacing:3px;border-radius:14px;background:var(--accent);color:#fff;box-shadow:var(--shadow);transition:transform .1s,filter .15s}
.big-btn:active{transform:scale(.98)} .big-btn:hover{filter:brightness(1.06)}
.status{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.stat .n{color:var(--ink);font-variant-numeric:tabular-nums}
.stat.score .n{color:var(--gold)} .stat.combo .n{color:var(--accent)}
.hearts{color:var(--red);font-size:15px;letter-spacing:2px}
.progress-txt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.timebar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.timebar .fill{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:99px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dim,#c9b99a)}
.qtype{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);margin-bottom:14px}
.qtext{font-family:var(--serif);font-size:17px;line-height:1.9;color:var(--ink);text-align:justify}
.qtext.word{font-size:32px;font-weight:700;text-align:center;letter-spacing:6px;padding:10px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.onecol{grid-template-columns:1fr}
.opt{position:relative;padding:15px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;text-align:center;letter-spacing:1px;box-shadow:var(--shadow);transition:all .12s;overflow:hidden}
.opt:active{transform:scale(.97)}
.opt.sent{font-family:var(--serif);font-size:13.5px;text-align:left;letter-spacing:0;line-height:1.75;font-weight:600;padding:13px 14px}
.opt .dcolor{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--oc,#c9b99a)}
.opt.correct{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.opt.dimmed{opacity:.4}
.bkcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:20px;margin-top:16px;animation:pop .25s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.bk-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bk-word{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:2px}
.dimchip{font-size:11px;font-weight:700;color:#fff;padding:3px 10px;border-radius:99px;letter-spacing:1px}
.bk-block{margin-top:12px;padding:12px;border-radius:12px;background:var(--surface-2)}
.bk-block .tag{font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.bk-block.buzu .tag{color:var(--red)} .bk-block.you .tag{color:var(--green)} .bk-block.up .tag{color:var(--gold)}
.bk-block .txt{font-family:var(--serif);font-size:15px;line-height:1.85;color:var(--ink);text-align:justify}
.feedback{text-align:center;font-size:13px;font-weight:700;margin-top:10px;letter-spacing:1px}
.feedback.ok{color:var(--green)} .feedback.no{color:var(--red)}
.next-btn{width:100%;margin-top:14px;padding:14px;font-size:16px;font-weight:700;letter-spacing:2px;border-radius:13px;background:var(--accent);color:#fff}
.next-btn:active{transform:scale(.98)}
.over{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center}
.over .big{font-size:54px;text-align:center}
.over h2{font-family:var(--serif);text-align:center;font-size:26px;letter-spacing:2px}
.score-big{text-align:center}
.score-big .s{font-family:var(--serif);font-size:56px;font-weight:700;color:var(--gold);line-height:1}
.score-big .l{font-size:12px;color:var(--ink-3);letter-spacing:2px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.mini .n{font-family:var(--serif);font-size:26px;font-weight:700}
.mini .l{font-size:11px;color:var(--ink-3);letter-spacing:1px;margin-top:2px}
.mini .n.g{color:var(--green)} .mini .n.r{color:var(--red)} .mini .n.a{color:var(--gold)}
.weak-list{margin-top:4px}
.weak-list h3{font-size:13px;color:var(--ink-2);letter-spacing:2px;margin-bottom:10px}
.weak-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.weak-item .w{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:1px}
.weak-item .d{margin-left:auto;font-size:11px;color:#fff;padding:2px 8px;border-radius:99px}
.empty-note{text-align:center;color:var(--ink-3);font-size:13px;padding:20px 0}
.footer{text-align:center;color:var(--ink-3);font-size:11px;margin-top:22px;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><h1>论说文 · 理由闯关</h1><p id="brandSub">正方 23 理由 + 反方 9 理由</p></div>
    <button class="icon-btn" id="themeBtn" aria-label="主题">
      <svg id="icSun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <svg id="icMoon" viewBox="0 0 24 24" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div id="app"></div>
  <div class="footer">论说文理由库 · 闯关背卡</div>
</div>
<script>
/* ================= 数据（构建时注入） ================= */

      <div class="seg bank-seg" id="bankSeg">
        <button data-bank="zheng" class="${bank==='zheng'?'on':''}">正方理由 · 23</button>
        <button data-bank="fan" class="${bank==='fan'?'on':''}">反方理由 · 9</button>
      </div>
    </div>
    <div class="panel">
      <h3>题型</h3>
      <div class="seg" id="modeSeg">
        ${Object.keys(modes).map(k=>`<button data-mode="${k}" class="${k==='mix'?'on':''}">${modes[k].t}</button>`).join('')}
      </div>
      <div id="modeDesc" style="font-size:12px;color:var(--ink-3);margin-top:10px">${modes.mix.d}</div>
    </div>
    <div class="panel">
      <h3>题量</h3>
      <div class="seg" id="roundSeg">
        ${Object.keys(ROUNDS).map(k=>`<button data-round="${k}" class="${k==='r10'?'on':''}">${ROUNDS[k].t}</button>`).join('')}
      </div>
    </div>
    ${best>0?`<div class="weak-note">🏆 历史最高分 ${best}${weakN?` · 已标记 ${weakN} 个弱项`:''}</div>`:''}
    <button class="big-btn" id="startBtn">开始闯关</button>
  </div>`;
}

function items(){ return bank==='fan' ? FANFANG : REASONS; }
function pickItem(){
  const pool = items();
  const ws = pool.map(r => 1 + (weak[r.id]||0)*2.5);
  const total = ws.reduce((a,b)=>a+b,0);
  let x = Math.random()*total;
  for(let i=0;i<pool.length;i++){ x -= ws[i]; if(x<=0) return pool[i]; }
  return pool[pool.length-1];
}
function pickType(){
  const pool = bank==='fan' ? ['fan','tui','kw2tui'] : ['buzu','you','sent','dim'];
  if(game.mode==='mix') return pool[Math.floor(Math.random()*pool.length)];
  return game.mode;
}
function makeOptions(item, type){
  if(bank==='fan'){
    if(type==='fan'){
      const decoys = shuffle(FANFANG.filter(r=>r.id!==item.id)).slice(0,3).map(r=>r.kw);
      return shuffle([item.kw, ...decoys]).map(w=>({txt:w, ok:w===item.kw}));
    }
    const decoys = shuffle(FANFANG.filter(r=>r.id!==item.id)).slice(0,3).map(r=>r.tui);
    return shuffle([item.tui, ...decoys]).map(s=>({txt:s, ok:s===item.tui}));
  }
  if(type==='dim') return shuffle(DIMS.map(d=>({txt:d.name, ok:d.id===item.dim, color:d.color})));
  if(type==='sent'){
    const sub = Math.random()<0.5?'buzu':'you';
    const decoys = shuffle(REASONS.filter(r=>r.id!==item.id)).slice(0,3).map(r=>r[sub]);
    return shuffle([item[sub], ...decoys]).map(s=>({txt:s, ok:s===item[sub]}));
  }
  const decoys = shuffle(REASONS.filter(r=>r.id!==item.id)).slice(0,3).map(r=>r.word);
  return shuffle([item.word, ...decoys]).map(w=>({txt:w, ok:w===item.word}));
}
function genQuestion(){
  const reason = pickItem();
  const type = pickType();
  let content, prompt, options;
  if(bank==='fan'){
    if(type==='fan'){ content = reason.fan; prompt = '这是哪个反方理由的「顾虑」？'; }
    else if(type==='tui'){ content = reason.fan; prompt = '这段顾虑，该怎么「推翻」？'; }
    else { content = reason.kw; prompt = '这个理由，该怎么「推翻」？'; }
  } else {
    if(type==='buzu'){ content = reason.buzu; prompt = '这是哪个理由的「客观不足」？'; }
    else if(type==='you'){ content = reason.you; prompt = '这是哪个理由的「主观优点」？'; }
    else if(type==='sent'){ const sub = Math.random()<0.5?'buzu':'you'; content = reason.word; prompt = sub==='buzu'?'哪一句是这个理由的「客观不足」？':'哪一句是这个理由的「主观优点」？'; }
    else { content = reason.word; prompt = '这个理由属于哪个维度？'; }
  }
  options = makeOptions(reason, type);
  return { reason, type, options, content, prompt };
}

function startGame(mode, roundsKey){
  game = { mode, rounds:ROUNDS[roundsKey].n, hearts:3, i:0, total:0, score:0, combo:0, correct:0, wrong:0, wrongIds:[], cur:null, answered:false, timer:null, startedAt:0 };
  renderQuestion();
}
function renderQuestion(){
  const q = genQuestion();
  game.cur = q; game.answered = false; game.startedAt = Date.now();
  const totalTxt = game.rounds>0 ? `${game.i+1} / ${game.rounds}` : '';
  const heartsTxt = game.rounds===0 ? `<span class="hearts">${'❤'.repeat(game.hearts)}${'🤍'.repeat(3-game.hearts)}</span>` : '';
  const comboTxt = game.combo>=2 ? `<div class="stat combo">🔥 <span class="n">×${game.combo}</span></div>` : '';
  const isWord = q.type==='dim' || q.type==='kw2tui';
  const isSent = bank==='fan' ? (q.type!=='fan') : (q.type==='sent');
  app.innerHTML = `<div>
    <div class="status">
      <div class="stat score">⭐ <span class="n">${game.score}</span></div>
      ${comboTxt}${heartsTxt}<span class="progress-txt">${totalTxt}</span>
    </div>
    <div class="timebar"><div class="fill" id="tfill"></div></div>
    <div class="qcard" style="--dim:${bank==='fan'?'#8a5b7d':dimColor(q.reason.dim)}">
      <span class="qtype">${modeLabel(q.type)}</span>
      <div class="qtext ${isWord?'word':''}">${esc(q.content)}</div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:12px">${esc(q.prompt)}</div>
    </div>
    <div class="opts ${(q.type==='dim'||isSent)?'onecol':''}">
      ${q.options.map((o,idx)=>`<button class="opt ${isSent?'sent':''}" data-opt="${idx}" ${o.color?`style="--oc:${o.color}"`:''}>${o.color?`<span class="dcolor"></span>`:''}${esc(o.txt)}</button>`).join('')}
    </div>
  </div>`;
  startTimer();
}
function startTimer(){
  const fill = $('#tfill');
  if(fill){ fill.className='fill'; fill.style.transition='none'; fill.style.width='100%'; requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ fill.style.transition=`width ${QTIME}ms linear`; fill.style.width='0%'; }); }); }
  clearTimeout(game.timer);
  game.timer = setTimeout(()=>{ if(!game.answered) answer(-1, true); }, QTIME);
}
function timeBonus(){ return Math.round(Math.max(0, 1 - (Date.now()-game.startedAt)/QTIME) * 100); }

function answer(optIdx, isTimeout){
  if(game.answered) return;
  game.answered = true;
  clearTimeout(game.timer);
  const q = game.cur;
  const ok = !isTimeout && optIdx>=0 && q.options[optIdx].ok;
  const optEls = app.querySelectorAll('.opt');
  const elAt = idx => (optEls && optEls[idx]) || null;
  if(ok){
    game.correct++; game.combo++;
    game.score += 100 + timeBonus() + (game.combo-1)*10;
    if(weak[q.reason.id]) weak[q.reason.id] = Math.max(0, weak[q.reason.id]-1);
    if(elAt(optIdx)) elAt(optIdx).classList.add('correct');
  } else {
    game.wrong++; game.combo = 0;
    weak[q.reason.id] = (weak[q.reason.id]||0)+1;
    game.wrongIds.push(q.reason.id);
    if(game.rounds===0) game.hearts--;
    if(elAt(optIdx)) elAt(optIdx).classList.add('wrong');
    q.options.forEach((o,idx)=>{ const el=elAt(idx); if(o.ok && el) el.classList.add('correct'); });
  }
  q.options.forEach((o,idx)=>{ const el=elAt(idx); if(el && !(idx===optIdx || o.ok)) el.classList.add('dimmed'); });
  saveWeak(weak);
  renderBkCard(ok);
}
function renderBkCard(ok){
  const q = game.cur, r = q.reason;
  const isLast = game.rounds>0 ? (game.i+1 >= game.rounds) : false;
  const dead = game.rounds===0 && game.hearts<=0;
  const nextLabel = (dead || isLast) ? '查看成绩' : '下一题';
  const detail = bank==='fan'
    ? `<div class="bk-head"><span class="bk-word">${esc(r.kw)}</span><span class="dimchip" style="background:#8a5b7d">反方理由</span></div>
       <div class="bk-block buzu"><div class="tag">反方 · 顾虑</div><div class="txt">${esc(r.fan)}</div></div>
       <div class="bk-block you"><div class="tag">推翻 · 话术</div><div class="txt">${esc(r.tui)}</div></div>`
    : `<div class="bk-head"><span class="bk-word">${esc(r.word)}</span><span class="dimchip" style="background:${dimColor(r.dim)}">${dimName(r.dim)}</span></div>
       <div class="bk-block buzu"><div class="tag">客观 · 不足</div><div class="txt">${esc(r.buzu)}</div></div>
       <div class="bk-block you"><div class="tag">主观 · 优点</div><div class="txt">${esc(r.you)}</div></div>
       ${r.you2?`<div class="bk-block up"><div class="tag">主观 · 优点 · 升级</div><div class="txt">${esc(r.you2)}</div></div>`:''}`;
  app.innerHTML = `<div>
    <div class="status">
      <div class="stat score">⭐ <span class="n">${game.score}</span></div>
      ${game.combo>=2?`<div class="stat combo">🔥 <span class="n">×${game.combo}</span></div>`:''}
      ${game.rounds===0?`<span class="hearts">${'❤'.repeat(Math.max(0,game.hearts))}${'🤍'.repeat(3-Math.max(0,game.hearts))}</span>`:''}
      <span class="progress-txt">${game.rounds>0?`${game.i+1} / ${game.rounds}`:''}</span>
    </div>
    <div class="feedback ${ok?'ok':'no'}">${ok?`✅ 答对了！+${100+timeBonus()+(game.combo-1)*10} 分`:(game.rounds===0&&game.hearts<=0?'💔 答错了，生命耗尽':'❌ 答错了，记下这个理由')}</div>
    <div class="bkcard">${detail}</div>
    <button class="next-btn" id="nextBtn">${nextLabel}</button>
  </div>`;
}
function nextQuestion(){
  game.i++;
  if(game.rounds>0 && game.i >= game.rounds){ renderOver(); return; }
  if(game.rounds===0 && game.hearts<=0){ renderOver(); return; }
  renderQuestion();
}
function renderOver(){
  const acc = Math.round(game.correct/(game.correct+game.wrong||1)*100);
  const best = parseInt(localStorage.getItem(LS_BEST)||'0',10);
  if(game.score>best) localStorage.setItem(LS_BEST, String(game.score));
  const weakList = shuffle([...new Set(game.wrongIds)]).slice(0,8).map(id=>{
    const r = (bank==='fan'?FANFANG:REASONS).find(x=>x.id===id);
    const nm = r ? (bank==='fan'?r.kw:r.word) : '';
    const dim = r && bank!=='fan' ? dimName(r.dim) : (bank==='fan'?'反方':'');
    return r?`<div class="weak-item"><span class="w">${esc(nm)}</span><span class="d" style="background:${bank==='fan'?'#8a5b7d':dimColor(r.dim)}">${dim}</span></div>`:'';
  }).join('');
  const isNewBest = game.score>=best && best>0;
  app.innerHTML = `<div class="over">
    <div class="big">${game.correct>game.wrong?'🎉':'💪'}</div>
    <h2>${game.correct>game.wrong?'闯关完成！':'继续加油！'}</h2>
    <div class="score-big"><div class="s">${game.score}</div><div class="l">${isNewBest?'🏆 新纪录！':'本局得分'}</div></div>
    <div class="grid2">
      <div class="mini"><div class="n g">${game.correct}</div><div class="l">答对</div></div>
      <div class="mini"><div class="n r">${game.wrong}</div><div class="l">答错</div></div>
      <div class="mini"><div class="n a">${acc}%</div><div class="l">正确率</div></div>
      <div class="mini"><div class="n">${game.combo}</div><div class="l">最高连击</div></div>
    </div>
    <div class="weak-list"><h3>📌 要重点背的</h3>${weakList || '<div class="empty-note">全部答对，太稳了！</div>'}</div>
    <button class="big-btn" id="againBtn">再来一局</button>
    <button class="big-btn" id="homeBtn" style="background:var(--surface-2);color:var(--ink-2);margin-top:10px">返回设置</button>
  </div>`;
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  $('#icSun').style.display = theme==='dark'?'none':'block';
  $('#icMoon').style.display = theme==='dark'?'block':'none';
}
$('#themeBtn').addEventListener('click', ()=>{
  theme = theme==='light'?'dark':'light';
  localStorage.setItem('lunshuowen_game_theme', theme);
  applyTheme();
});

let selMode = 'mix', selRounds = 'r10';
app.addEventListener('click', e=>{
  const bb = e.target.closest('[data-bank]');
  if(bb){
    bank = bb.dataset.bank;
    selMode = 'mix';
    renderStart();
    return;
  }
  const mb = e.target.closest('[data-mode]');
  if(mb){
    selMode = mb.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on', b===mb));
    $('#modeDesc').textContent = modesOf()[selMode].d;
    return;
  }
  const rb = e.target.closest('[data-round]');
  if(rb){
    selRounds = rb.dataset.round;
    document.querySelectorAll('[data-round]').forEach(b=>b.classList.toggle('on', b===rb));
    return;
  }
  if(e.target.closest('#startBtn')){ startGame(selMode, selRounds); return; }
  if(e.target.closest('#nextBtn')){ nextQuestion(); return; }
  if(e.target.closest('#againBtn')){ startGame(selMode, selRounds); return; }
  if(e.target.closest('#homeBtn')){ renderStart(); return; }
  const ob = e.target.closest('[data-opt]');
  if(ob){ const idx = parseInt(ob.dataset.opt,10); if(!game.answered) answer(idx); return; }
});

applyTheme();
renderStart();
</script>
</body>
</html>
